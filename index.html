        function showWelcomeModal() {
            // التحقق مما إذا كانت الرسالة ظهرت من قبل في هذه الجلسة
            if (!sessionStorage.getItem('welcomeMessageShown')) {
                const modal = document.getElementById('welcome-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                
                // إضافة تأخير بسيط لتفعيل الأنيميشن بسلاسة
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.querySelector('.transform').classList.remove('scale-95');
                    modal.querySelector('.transform').classList.add('scale-100');
                }, 10);

                // حفظ في الجلسة لكي لا تظهر مرة أخرى إلا إذا أغلق المتصفح
                sessionStorage.setItem('welcomeMessageShown', 'true');
            }
        }

            const modal = document.getElementById('welcome-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('.transform').classList.remove('scale-100');
            modal.querySelector('.transform').classList.add('scale-95');

                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);

                return;
            }

            const subject = data.subjects.find(s => s.id === lecDetails.subjectId);

            let html = `
                <div class="fade-in pb-10">
                    <button onclick="renderSubject('${subject.id}')" class="mb-6 text-medical-600 hover:text-medical-800 font-semibold flex items-center">
                        <i class="fa-solid fa-arrow-right ml-2"></i> العودة لمحاضرات ${subject.name}
                    </button>
                    
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
                        <div class="bg-medical-600 p-6 text-white">
                            <h2 class="text-2xl font-bold" dir="ltr">${lecDetails.title}</h2>
                            <p class="opacity-90 mt-1">${lecDetails.arabicTitle}</p>
                        </div>
                        
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-gray-800 mb-3 flex items-center"><i class="fa-solid fa-file-pdf text-red-500 ml-2"></i> الملفات والملخص</h3>
                            <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-semibold transition mb-4">
                                <i class="fa-solid fa-download ml-2"></i> تحميل PDF المحاضرة الأصلي
                            </button>
                            
                            <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl">
                                <h4 class="font-bold text-blue-800 mb-2">🧠 الخلاصة والشرح المبسط:</h4>
                                <p class="text-gray-700 leading-relaxed">${lecDetails.summary.replace(/\n/g, '<br>')}</p>
                            </div>

                            ${lecDetails.images && lecDetails.images.length > 0 ? `
                                <div class="mt-6 space-y-4">
                                    <h4 class="font-bold text-gray-800 mb-2"><i class="fa-regular fa-image text-medical-500 mr-2"></i> صور توضيحية:</h4>
                                    ${lecDetails.images.map(img => `
                                        <div class="rounded-xl overflow-hidden border border-gray-200 shadow-sm">
                                            <img src="${img.url}" alt="${img.alt}" class="w-full h-auto object-cover">
                                            <p class="text-center text-sm text-gray-500 bg-gray-50 py-2">${img.alt}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <!-- المصطلحات -->
                        <div class="lg:col-span-2">
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center"><i class="fa-solid fa-language text-medical-500 ml-2"></i> أهم المصطلحات (Medical Terms)</h3>
                                <div class="space-y-3">
                                    ${lecDetails.terms.map(term => `
                                        <div class="border-b border-gray-100 pb-3 last:border-0">
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="font-bold text-lg text-gray-800" dir="ltr">${term.en}</span>
                                                <span class="font-bold text-medical-600">${term.ar}</span>
                                            </div>
                                            <p class="text-gray-500 text-sm">${term.desc}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            ${lecDetails.videoUrl ? `
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-8">
                                <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center"><i class="fa-solid fa-play-circle text-red-500 ml-2"></i> فيديو توضيحي</h3>
                                <div class="aspect-w-16 aspect-h-9">
                                    <iframe class="w-full h-64 md:h-96 rounded-xl" src="${lecDetails.videoUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        <!-- أدوات التفاعل -->
                        <div>
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sticky top-20">
                                <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">اختبر نفسك</h3>
                                
                                <button onclick="startQuiz('${lectureId}')" class="w-full mb-4 bg-medical-500 hover:bg-medical-600 text-white py-3 rounded-xl font-bold transition flex justify-center items-center">
                                    <i class="fa-solid fa-list-check ml-2"></i> ابدأ Quiz المحاضرة
                                </button>
                                
                                <button onclick="startGame('${lectureId}')" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold transition flex justify-center items-center">
                                    <i class="fa-solid fa-gamepad ml-2"></i> لعبة الكلمات 🔥
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        // قاموس المصطلحات
        function renderDictionary() {
            let allTerms = [];
            // تجميع كل المصطلحات من كل المحاضرات
            Object.values(data.lectureDetails).forEach(lec => {
                allTerms = allTerms.concat(lec.terms);
            });

            // إزالة التكرار إن وجد بناءً على الكلمة الإنجليزية
            const uniqueTerms = Array.from(new Set(allTerms.map(a => a.en)))
                .map(en => {
                    return allTerms.find(a => a.en === en)
                }).sort((a, b) => a.en.localeCompare(b.en)); // ترتيب أبجدي

            let html = `
                <div class="fade-in max-w-4xl mx-auto">
                    <h2 class="text-3xl font-bold text-medical-900 mb-6 text-center">قاموس المصطلحات الطبية</h2>
                    
                    <div class="relative mb-8">
                        <input type="text" id="searchInput" onkeyup="filterDictionary()" placeholder="ابحث بالإنجليزية أو العربية..." class="w-full p-4 pr-12 rounded-xl border border-gray-300 focus:outline-none focus:border-medical-500 focus:ring-1 focus:ring-medical-500 shadow-sm text-lg">
                        <i class="fa-solid fa-search absolute right-4 top-5 text-gray-400 text-xl"></i>
                    </div>

                    <div id="dictionaryList" class="space-y-4">
                        ${uniqueTerms.map(term => `
                            <div class="term-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row md:items-center justify-between">
                                <div class="mb-2 md:mb-0 w-full md:w-1/3 text-left">
                                    <span class="en-term font-bold text-xl text-gray-800" dir="ltr">${term.en}</span>
                                </div>
                                <div class="w-full md:w-1/4 mb-2 md:mb-0">
                                    <span class="ar-term font-bold text-medical-600 bg-medical-50 px-3 py-1 rounded-full text-sm">${term.ar}</span>
                                </div>
                                <div class="w-full md:w-1/2 text-gray-600 text-sm">
                                    <span class="desc-term">${term.desc}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function filterDictionary() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('term-card');
            
            for (let i = 0; i < cards.length; i++) {
                let en = cards[i].querySelector('.en-term').innerText.toLowerCase();
                let ar = cards[i].querySelector('.ar-term').innerText.toLowerCase();
                let desc = cards[i].querySelector('.desc-term').innerText.toLowerCase();
                
                if (en.includes(input) || ar.includes(input) || desc.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // ---------------------------------------------------------
        // 3. نظام الاختبارات (Quiz System)
        // ---------------------------------------------------------
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let activeLectureId = '';

        function startQuiz(lectureId) {
            activeLectureId = lectureId;
            currentQuiz = data.lectureDetails[lectureId].quiz;
            currentQuestionIndex = 0;
            score = 0;
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            if(currentQuestionIndex >= currentQuiz.length) {
                renderQuizResults();
                return;
            }

            const q = currentQuiz[currentQuestionIndex];
            
            let html = `
                <div class="fade-in max-w-2xl mx-auto mt-10">
                    <button onclick="renderLecture('${activeLectureId}')" class="mb-6 text-gray-500 hover:text-gray-800 flex items-center">
                        <i class="fa-solid fa-times ml-2"></i> إنهاء وخروج
                    </button>
                    
                    <div class="bg-white rounded-2xl shadow-md p-8 border border-gray-100">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-gray-500 font-semibold">سؤال ${currentQuestionIndex + 1} من ${currentQuiz.length}</span>
                            <span class="bg-medical-100 text-medical-800 px-3 py-1 rounded-full text-sm font-bold">النتيجة: ${score}</span>
                        </div>
                        
                        <h2 class="text-2xl font-bold text-gray-800 mb-8" dir="auto">${q.q}</h2>
                        
                        <div class="space-y-3" id="options-container">
                            ${q.options.map((opt, index) => `
                                <button onclick="checkAnswer(${index}, ${q.correctIndex})" class="quiz-btn w-full text-left bg-gray-50 hover:bg-gray-100 border border-gray-200 p-4 rounded-xl font-semibold text-gray-700 transition" dir="auto">
                                    ${String.fromCharCode(65 + index)}. ${opt}
                                </button>
                            `).join('')}
                        </div>
                        
                        <div id="feedback" class="mt-6 hidden text-center font-bold text-lg rounded-lg p-3"></div>
                        
                        <button id="next-btn" onclick="nextQuestion()" class="hidden w-full mt-6 bg-medical-600 hover:bg-medical-700 text-white py-3 rounded-xl font-bold transition">
                            السؤال التالي <i class="fa-solid fa-arrow-left mr-2"></i>
                        </button>
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function checkAnswer(selectedIndex, correctIndex) {
            const buttons = document.querySelectorAll('.quiz-btn');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            // إيقاف الأزرار
            buttons.forEach(btn => btn.disabled = true);

            if(selectedIndex === correctIndex) {
                buttons[selectedIndex].classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                feedback.innerHTML = '✅ إجابة صحيحة!';
                feedback.classList.add('bg-green-50', 'text-green-700', 'block');
                feedback.classList.remove('hidden');
                score++;
            } else {
                buttons[selectedIndex].classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                buttons[correctIndex].classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                feedback.innerHTML = '❌ إجابة خاطئة!';
                feedback.classList.add('bg-red-50', 'text-red-700', 'block');
                feedback.classList.remove('hidden');
            }

            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuizQuestion();
        }

        function renderQuizResults() {
            let html = `
                <div class="fade-in max-w-lg mx-auto mt-20 text-center bg-white rounded-2xl shadow-lg p-10 border border-gray-100">
                    <div class="text-6xl mb-4">${score === currentQuiz.length ? '🏆' : '👍'}</div>
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">اكتمل الاختبار!</h2>
                    <p class="text-gray-500 mb-6">نتيجتك النهائية هي:</p>
                    <div class="text-5xl font-extrabold text-medical-600 mb-8" dir="ltr">
                        ${score} / ${currentQuiz.length}
                    </div>
                    <div class="flex flex-col space-y-3">
                        <button onclick="startQuiz('${activeLectureId}')" class="bg-gray-100 hover:bg-gray-200 text-gray-800 py-3 rounded-xl font-bold transition">
                            <i class="fa-solid fa-rotate-right ml-2"></i> إعادة الاختبار
                        </button>
                        <button onclick="renderLecture('${activeLectureId}')" class="bg-medical-500 hover:bg-medical-600 text-white py-3 rounded-xl font-bold transition">
                            <i class="fa-solid fa-book ml-2"></i> العودة للمحاضرة
                        </button>
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }


        // ---------------------------------------------------------
        // 4. لعبة المصطلحات (Vocabulary Game)
        // ---------------------------------------------------------
        let gameTerms = [];
        let gameScore = 0;
        let gameStreak = 0;
        let gameLives = 3;
        let currentGameTerm = null;

        function startGame(lectureId) {
            activeLectureId = lectureId;
            gameTerms = data.lectureDetails[lectureId].terms;
            if(gameTerms.length < 4) {
                alert("اللعبة تتطلب وجود 4 مصطلحات على الأقل في المحاضرة.");
                return;
            }
            gameScore = 0;
            gameStreak = 0;
            gameLives = 3;
            renderGameScreen();
        }

        function renderGameScreen() {
            if(gameLives <= 0) {
                renderGameOver();
                return;
            }

            // اختيار مصطلح عشوائي
            currentGameTerm = gameTerms[Math.floor(Math.random() * gameTerms.length)];
            
            // اختيار 3 إجابات خاطئة
            let distractors = gameTerms.filter(t => t.en !== currentGameTerm.en);
            // خلط الإجابات الخاطئة وأخذ 3
            distractors = distractors.sort(() => 0.5 - Math.random()).slice(0, 3);
            
            // دمج الصح مع الخطأ وخلطهم
            let options = [...distractors, currentGameTerm].sort(() => 0.5 - Math.random());

            let html = `
                <div class="fade-in max-w-3xl mx-auto mt-6">
                    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <button onclick="renderLecture('${activeLectureId}')" class="text-gray-500 hover:text-red-500 font-bold">
                            <i class="fa-solid fa-times"></i> خروج
                        </button>
                        <div class="flex space-x-6 space-x-reverse font-bold text-lg">
                            <div class="text-orange-500" title="Streak"><i class="fa-solid fa-fire"></i> ${gameStreak}</div>
                            <div class="text-medical-600" title="Score"><i class="fa-solid fa-star"></i> ${gameScore}</div>
                            <div class="text-red-500" title="Lives">
                                ${Array(gameLives).fill('<i class="fa-solid fa-heart"></i>').join(' ')}
                            </div>
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-medical-800 to-medical-600 rounded-3xl shadow-xl p-10 text-center mb-8 relative overflow-hidden">
                        <div class="absolute top-0 right-0 opacity-10 text-9xl transform translate-x-1/4 -translate-y-1/4">
                            <i class="fa-solid fa-brain"></i>
                        </div>
                        <h3 class="text-medical-100 mb-2 font-semibold">ما هو المعنى الصحيح لـ:</h3>
                        <h2 class="text-5xl font-extrabold text-white tracking-wider" dir="ltr">${currentGameTerm.en}</h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${options.map(opt => `
                            <button onclick="checkGameAnswer('${opt.en}', this)" class="game-btn bg-white hover:bg-gray-50 border-2 border-gray-200 text-gray-800 font-bold text-xl py-6 rounded-2xl shadow-sm transition transform hover:-translate-y-1 hover:border-medical-400">
                                ${opt.ar}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function checkGameAnswer(selectedEn, btnElement) {
            const buttons = document.querySelectorAll('.game-btn');
            buttons.forEach(b => b.disabled = true); // منع النقر المتعدد

            if(selectedEn === currentGameTerm.en) {
                // صح
                btnElement.classList.remove('border-gray-200', 'text-gray-800');
                btnElement.classList.add('bg-green-500', 'border-green-600', 'text-white');
                
                gameStreak++;
                gameScore += (10 + gameStreak * 2); // نقاط إضافية مع الستريك
                
                setTimeout(() => {
                    renderGameScreen();
                }, 800);
            } else {
                // خطأ
                btnElement.classList.remove('border-gray-200', 'text-gray-800');
                btnElement.classList.add('bg-red-500', 'border-red-600', 'text-white');
                
                // تلوين الإجابة الصحيحة
                buttons.forEach(b => {
                    if(b.innerText.includes(currentGameTerm.ar)) {
                        b.classList.remove('border-gray-200');
                        b.classList.add('bg-green-100', 'border-green-500');
                    }
                });

                gameStreak = 0;
                gameLives--;
                
                setTimeout(() => {
                    renderGameScreen();
                }, 1500);
            }
        }

        function renderGameOver() {
            let html = `
                <div class="fade-in max-w-md mx-auto mt-20 text-center bg-white rounded-3xl shadow-2xl p-10 border border-gray-100">
                    <div class="text-7xl mb-6">💔</div>
                    <h2 class="text-4xl font-black text-gray-800 mb-2">Game Over</h2>
                    <p class="text-gray-500 mb-6">لقد نفدت محاولاتك!</p>
                    
                    <div class="bg-gray-50 rounded-xl p-6 mb-8 border border-gray-200">
                        <div class="text-sm text-gray-500 mb-1">النقاط النهائية</div>
                        <div class="text-5xl font-extrabold text-orange-500 flex justify-center items-center">
                            ${gameScore} <i class="fa-solid fa-star text-3xl ml-2 mb-1"></i>
                        </div>
                    </div>
                    
                    <button onclick="startGame('${activeLectureId}')" class="w-full bg-medical-500 hover:bg-medical-600 text-white py-4 rounded-xl font-bold text-lg transition mb-3">
                        <i class="fa-solid fa-rotate-right ml-2"></i> العب مرة أخرى
                    </button>
                    <button onclick="renderLecture('${activeLectureId}')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-xl font-bold transition">
                        العودة للمحاضرة
                    </button>
                </div>
            `;
            appContent.innerHTML = html;
        }

        // ---------------------------------------------------------
        // 5. تهيئة التطبيق عند البداية
        // ---------------------------------------------------------
        window.onload = () => {
            renderHome();
            // تشغيل رسالة الترحيب بعد تحميل الصفحة بنصف ثانية
            setTimeout(showWelcomeModal, 500);
        };

    </script>
</body>
</html>
