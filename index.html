                        <div class="card-inner transform-style-3d transition-transform duration-500 w-full h-full relative shadow-xl rounded-3xl">
                            <!-- Front -->
                            <div class="backface-hidden absolute inset-0 bg-gradient-to-br from-medical-500 to-teal-700 text-white rounded-3xl p-8 flex flex-col items-center justify-center text-center">
                                <span class="text-xs bg-white/20 px-3 py-1 rounded-full mb-4">English Term</span>
                                <h3 class="text-4xl font-extrabold mb-4" dir="ltr">${card.en}</h3>
                                <button onclick="event.stopPropagation(); speakText('${card.en.replace(/'/g, "\\'")}')" class="bg-white/20 hover:bg-white/30 p-3 rounded-full text-white text-lg">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            </div>
                            <!-- Back -->
                            <div class="rotate-y-180 backface-hidden absolute inset-0 bg-white dark:bg-slate-800 text-gray-800 dark:text-gray-100 rounded-3xl p-8 border-2 border-medical-500 flex flex-col items-center justify-center text-center">
                                <span class="text-xs bg-medical-100 dark:bg-slate-700 text-medical-800 dark:text-medical-300 font-bold px-3 py-1 rounded-full mb-3">الترجمة والشرح</span>
                                <h3 class="text-3xl font-black text-medical-600 dark:text-medical-400 mb-3">${card.ar}</h3>
                                <p class="text-gray-600 dark:text-gray-300 font-medium text-sm max-w-md">${card.desc}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Navigation Controls -->
                    <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
                        <button onclick="prevFlashcard()" class="px-5 py-2.5 rounded-xl bg-gray-100 dark:bg-slate-700 hover:bg-medical-500 hover:text-white font-bold transition">
                            <i class="fa-solid fa-arrow-right ml-2"></i> السابقة
                        </button>
                        <span class="font-bold text-gray-500 text-sm">${flashcardIndex + 1} من ${allAppTerms.length}</span>
                        <button onclick="nextFlashcard()" class="px-5 py-2.5 rounded-xl bg-gray-100 dark:bg-slate-700 hover:bg-medical-500 hover:text-white font-bold transition">
                            التالية <i class="fa-solid fa-arrow-left mr-2"></i>
                        </button>
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function nextFlashcard() {
            flashcardIndex = (flashcardIndex + 1) % allAppTerms.length;
            renderSingleFlashcard();
        }

        function prevFlashcard() {
            flashcardIndex = (flashcardIndex - 1 + allAppTerms.length) % allAppTerms.length;
            renderSingleFlashcard();
        }

        function renderDictionary() {
            let terms = [];
            Object.values(data.lectureDetails).forEach(lec => {
                if (lec.terms) terms.push(...lec.terms);
            });

            // Remove duplicates
            const uniqueTerms = Array.from(new Set(terms.map(t => t.en)))
                .map(en => terms.find(t => t.en === en))
                .sort((a,b) => a.en.localeCompare(b.en));

            let html = `
                <div class="fade-in max-w-4xl mx-auto py-6">
                    <h2 class="text-3xl font-black text-center text-medical-900 dark:text-white mb-6">قاموس المصطلحات الطبية الشامل 📖</h2>

                    <div class="relative mb-8">
                        <input type="text" id="searchInput" onkeyup="filterDictionary()" placeholder="ابحث عن أي مصطلح بالإنجليزية أو العربية..." class="w-full p-4 pr-12 rounded-2xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-medical-500 text-lg shadow-sm">
                        <i class="fa-solid fa-magnifying-glass absolute right-4 top-5 text-gray-400 text-xl"></i>
                    </div>

                    <div id="dictionaryList" class="space-y-3">
                        ${uniqueTerms.map(t => `
                            <div class="term-card bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                <div class="flex items-center space-x-3 space-x-reverse">
                                    <button onclick="speakText('${t.en.replace(/'/g, "\\'")}')" class="text-medical-500 hover:text-medical-600 p-2 bg-medical-50 dark:bg-slate-700 rounded-xl" title="استمع للنطق">
                                        <i class="fa-solid fa-volume-high text-lg"></i>
                                    </button>
                                    <div>
                                        <span class="en-term font-extrabold text-lg text-gray-900 dark:text-white block" dir="ltr">${t.en}</span>
                                        <span class="desc-term text-gray-500 dark:text-gray-400 text-xs">${t.desc}</span>
                                    </div>
                                </div>
                                <span class="ar-term font-bold text-medical-600 dark:text-medical-400 bg-teal-50 dark:bg-slate-700/60 px-4 py-2 rounded-xl text-sm self-start md:self-center">${t.ar}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function filterDictionary() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('term-card');
            for (let card of cards) {
                let en = card.querySelector('.en-term').innerText.toLowerCase();
                let ar = card.querySelector('.ar-term').innerText.toLowerCase();
                let desc = card.querySelector('.desc-term').innerText.toLowerCase();
                if (en.includes(input) || ar.includes(input) || desc.includes(input)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }

        function renderProgress() {
            let totalLectures = 0;
            Object.values(data.lectures).forEach(arr => totalLectures += arr.length);
            const percentage = Math.round((completedLectures.length / totalLectures) * 100);

            let html = `
                <div class="fade-in max-w-3xl mx-auto py-8">
                    <h2 class="text-3xl font-black text-center text-medical-900 dark:text-white mb-8">سجل الإنجاز والتقدم الدراسي 📊</h2>

                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-sm border border-gray-100 dark:border-slate-700 mb-8 text-center">
                        <div class="inline-flex items-center justify-center w-32 h-32 rounded-full border-8 border-medical-500 text-3xl font-black text-medical-600 dark:text-medical-400 mb-4">
                            ${percentage}%
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100">معدل إنهاء المقررات</h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">أنهيت ${completedLectures.length} من أصل ${totalLectures} محاضرات بنجاح.</p>
                    </div>

                    <div class="space-y-4">
                        ${data.subjects.map(s => {
                            const lecs = data.lectures[s.id] || [];
                            const done = lecs.filter(l => completedLectures.includes(l.id)).length;
                            return `
                                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-gray-800 dark:text-gray-100" dir="ltr">${s.name}</h4>
                                        <p class="text-xs text-gray-500">${done} من ${lecs.length} محاضرات مكتملة</p>
                                    </div>
                                    <span class="font-bold text-sm px-3 py-1 rounded-xl ${done === lecs.length ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-600'}">
                                        ${done === lecs.length ? 'مكتمل ✨' : 'قيد التقدم'}
                                    </span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let activeLectureId = '';

        function startQuiz(lectureId) {
            activeLectureId = lectureId;
            currentQuiz = data.lectureDetails[lectureId].quiz || [];
            if (currentQuiz.length === 0) {
                alert('لا توجد أسئلة متوفرة حالياً لهذه المحاضرة.');
                return;
            }
            currentQuestionIndex = 0;
            score = 0;
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            if(currentQuestionIndex >= currentQuiz.length) {
                renderQuizResults();
                return;
            }

            const q = currentQuiz[currentQuestionIndex];
            let html = `
                <div class="fade-in max-w-2xl mx-auto py-8">
                    <button onclick="renderLecture('${activeLectureId}')" class="mb-4 text-gray-500 hover:text-gray-800 font-bold text-sm">
                        <i class="fa-solid fa-xmark ml-1"></i> خروج من الاختبار
                    </button>

                    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-lg p-6 md:p-8 border border-gray-100 dark:border-slate-700">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-bold text-gray-400">سؤال ${currentQuestionIndex + 1} من ${currentQuiz.length}</span>
                            <span class="bg-medical-100 text-medical-800 text-xs font-bold px-3 py-1 rounded-full">النقاط: ${score}</span>
                        </div>

                        <h3 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white mb-6" dir="auto">${q.q}</h3>

                        <div class="space-y-3" id="options-container">
                            ${q.options.map((opt, i) => `
                                <button onclick="checkAnswer(${i}, ${q.correctIndex})" class="quiz-btn w-full text-left bg-slate-50 dark:bg-slate-700/50 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 p-4 rounded-2xl font-semibold text-gray-800 dark:text-gray-100 transition" dir="auto">
                                    ${String.fromCharCode(65 + i)}. ${opt}
                                </button>
                            `).join('')}
                        </div>

                        <div id="feedback" class="mt-6 hidden text-center font-bold text-base rounded-xl p-3"></div>

                        <button id="next-btn" onclick="nextQuestion()" class="hidden w-full mt-6 bg-medical-500 hover:bg-medical-600 text-white font-bold py-3.5 rounded-2xl transition">
                            السؤال التالي <i class="fa-solid fa-arrow-left mr-2"></i>
                        </button>
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function checkAnswer(selected, correct) {
            const btns = document.querySelectorAll('.quiz-btn');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            btns.forEach(b => b.disabled = true);

            if(selected === correct) {
                btns[selected].classList.add('bg-emerald-500', 'text-white');
                feedback.innerHTML = '✅ إجابة صحيحة ممتازة!';
                feedback.className = 'mt-6 bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300 font-bold text-base rounded-xl p-3 block';
                score++;
            } else {
                btns[selected].classList.add('bg-rose-500', 'text-white');
                btns[correct].classList.add('bg-emerald-500', 'text-white');
                feedback.innerHTML = '❌ إجابة خاطئة!';
                feedback.className = 'mt-6 bg-rose-100 text-rose-800 dark:bg-rose-900/50 dark:text-rose-300 font-bold text-base rounded-xl p-3 block';
            }
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuizQuestion();
        }

        function renderQuizResults() {
            if (score === currentQuiz.length && !completedLectures.includes(activeLectureId)) {
                completedLectures.push(activeLectureId);
                localStorage.setItem('nurse_hub_completed', JSON.stringify(completedLectures));
            }

            let html = `
                <div class="fade-in max-w-md mx-auto py-12 text-center">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-slate-700">
                        <div class="text-6xl mb-4">${score === currentQuiz.length ? '🏆' : '🎉'}</div>
                        <h2 class="text-2xl font-black text-gray-900 dark:text-white mb-2">أحسنت! أكملت الاختبار</h2>
                        <p class="text-gray-500 text-sm mb-6">درجتك النهائية هي:</p>

                        <div class="text-5xl font-black text-medical-500 mb-8" dir="ltr">${score} / ${currentQuiz.length}</div>

                        <div class="space-y-3">
                            <button onclick="startQuiz('${activeLectureId}')" class="w-full bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 text-gray-800 dark:text-gray-200 font-bold py-3.5 rounded-2xl transition">
                                <i class="fa-solid fa-rotate-right ml-2"></i> إعادة الاختبار
                            </button>
                            <button onclick="renderLecture('${activeLectureId}')" class="w-full bg-medical-500 hover:bg-medical-600 text-white font-bold py-3.5 rounded-2xl transition">
                                العودة للمحاضرة
                            </button>
                        </div>
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        let gameTerms = [];
        let gameScore = 0;
        let gameLives = 3;
        let currentGameTerm = null;

        function startGame(lectureId) {
            activeLectureId = lectureId;
            gameTerms = data.lectureDetails[lectureId].terms || [];
            if(gameTerms.length < 3) {
                alert('تتطلب هذه اللعبة وجود 3 مصطلحات على الأقل.');
                return;
            }
            gameScore = 0;
            gameLives = 3;
            renderGameScreen();
        }

        function renderGameScreen() {
            if(gameLives <= 0) {
                renderGameOver();
                return;
            }

            currentGameTerm = gameTerms[Math.floor(Math.random() * gameTerms.length)];
            let distractors = gameTerms.filter(t => t.en !== currentGameTerm.en).sort(() => 0.5 - Math.random()).slice(0, 3);
            let options = [...distractors, currentGameTerm].sort(() => 0.5 - Math.random());

            let html = `
                <div class="fade-in max-w-2xl mx-auto py-8">
                    <div class="flex justify-between items-center mb-6 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-gray-100 dark:border-slate-700">
                        <button onclick="renderLecture('${activeLectureId}')" class="text-gray-400 hover:text-rose-500 font-bold text-sm">إلغاء</button>
                        <div class="flex items-center space-x-6 space-x-reverse font-black">
                            <span class="text-amber-500"><i class="fa-solid fa-star ml-1"></i>${gameScore}</span>
                            <span class="text-rose-500">${Array(gameLives).fill('<i class="fa-solid fa-heart"></i>').join(' ')}</span>
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-amber-500 to-orange-600 text-white rounded-3xl p-8 text-center mb-6 shadow-lg">
                        <span class="text-xs font-bold uppercase tracking-wider opacity-80 mb-2 block">ما هي الترجمة الصحيحة لـ:</span>
                        <h2 class="text-4xl font-black" dir="ltr">${currentGameTerm.en}</h2>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${options.map(opt => `
                            <button onclick="checkGameAnswer('${opt.en}')" class="bg-white dark:bg-slate-800 hover:border-amber-500 border-2 border-gray-100 dark:border-slate-700 p-5 rounded-2xl font-bold text-lg text-gray-800 dark:text-gray-100 shadow-sm transition">
                                ${opt.ar}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function checkGameAnswer(selectedEn) {
            if (selectedEn === currentGameTerm.en) {
                gameScore += 10;
            } else {
                gameLives--;
            }
            renderGameScreen();
        }

        function renderGameOver() {
            let html = `
                <div class="fade-in max-w-sm mx-auto py-12 text-center">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-slate-700">
                        <div class="text-6xl mb-4">💔</div>
                        <h2 class="text-2xl font-black text-gray-900 dark:text-white mb-2">انتهت المحاولات!</h2>
                        <p class="text-gray-500 text-sm mb-6">النقاط التي جمعتها:</p>
                        <div class="text-5xl font-black text-amber-500 mb-8">${gameScore}</div>
                        <button onclick="startGame('${activeLectureId}')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-2xl transition">
                            لعب مرة أخرى
                        </button>
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }


        // Hangman Game (Save the patient)
        let hangmanWord = "";
        let hangmanHint = "";
        let hangmanGuessed = [];
        let hangmanLives = 6;

        function startHangman(lectureId) {
            activeLectureId = lectureId;
            const terms = data.lectureDetails[lectureId].terms || [];
            if(terms.length === 0) return;
            
            const term = terms[Math.floor(Math.random() * terms.length)];
            hangmanWord = term.en.toUpperCase();
            hangmanHint = term.ar;
            hangmanGuessed = [];
            hangmanLives = 6;
            renderHangman();
        }

        function renderHangman() {
            let displayWord = hangmanWord.split('').map(char => {
                if (char === ' ' || char === '-') return char;
                return hangmanGuessed.includes(char) ? char : '_';
            }).join(' ');

            let isWon = !displayWord.includes('_');
            let isLost = hangmanLives <= 0;

            const keyboardRows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];

            let html = `
                <div class="fade-in max-w-3xl mx-auto py-8">
                    <div class="flex justify-between items-center mb-6 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-gray-100 dark:border-slate-700">
                        <button onclick="renderLecture('${activeLectureId}')" class="text-gray-400 hover:text-rose-500 font-bold text-sm">
                            <i class="fa-solid fa-arrow-right ml-1"></i> العودة للمحاضرة
                        </button>
                        <div class="flex items-center font-black text-rose-500 text-lg">
                            ${Array(hangmanLives).fill('<i class="fa-solid fa-heart ml-1"></i>').join('')}
                            ${Array(6 - hangmanLives).fill('<i class="fa-solid fa-heart-crack text-gray-300 dark:text-gray-600 ml-1"></i>').join('')}
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-10 text-center shadow-md border border-gray-100 dark:border-slate-700 mb-6">
                        <h2 class="text-2xl font-black text-medical-900 dark:text-white mb-2">لعبة إنقاذ المريض 🚑</h2>
                        <p class="text-gray-500 text-sm mb-8">خمن الحروف الإنجليزية لمعنى: <span class="font-bold text-rose-600">${hangmanHint}</span></p>
                        
                        <div class="text-3xl md:text-5xl font-black text-gray-800 dark:text-gray-100 tracking-[0.25em] mb-10 overflow-x-auto pb-4" dir="ltr">
                            ${displayWord}
                        </div>

                        ${isWon ? `
                            <div class="bg-emerald-100 text-emerald-700 p-4 rounded-2xl font-bold mb-6">نجحت في إنقاذ المريض! المعنى الإنجليزي صحيح.</div>
                            <button onclick="startHangman('${activeLectureId}')" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 rounded-xl transition">إنقاذ مريض آخر</button>
                        ` : isLost ? `
                            <div class="bg-rose-100 text-rose-700 p-4 rounded-2xl font-bold mb-6">للأسف فقدنا المريض! الكلمة كانت: ${hangmanWord}</div>
                            <button onclick="startHangman('${activeLectureId}')" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 rounded-xl transition">حاول مرة أخرى</button>
                        ` : `
                            <div class="space-y-3" dir="ltr">
                                ${keyboardRows.map(row => `
                                    <div class="flex justify-center gap-1.5 md:gap-2">
                                        ${row.split('').map(letter => `
                                            <button onclick="guessHangmanLetter('${letter}')" 
                                                ${hangmanGuessed.includes(letter) ? 'disabled' : ''}
                                                class="w-8 h-10 md:w-11 md:h-12 rounded-lg font-bold text-sm md:text-base shadow-sm transition
                                                ${hangmanGuessed.includes(letter) 
                                                    ? (hangmanWord.includes(letter) ? 'bg-emerald-500 text-white border-transparent' : 'bg-gray-200 dark:bg-slate-700 text-gray-400 border-transparent') 
                                                    : 'bg-white dark:bg-slate-700 border-2 border-gray-200 dark:border-slate-600 text-gray-800 dark:text-gray-200 hover:bg-rose-50 hover:border-rose-300 dark:hover:border-rose-500'}">
                                                ${letter}
                                            </button>
                                        `).join('')}
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function guessHangmanLetter(letter) {
            if (hangmanGuessed.includes(letter)) return;
            hangmanGuessed.push(letter);
            if (!hangmanWord.includes(letter)) {
                hangmanLives--;
            }
            renderHangman();
        }

        function showWelcomeModal() {
            if (!sessionStorage.getItem('welcomeMessageShown')) {
                const modal = document.getElementById('welcome-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                }, 10);
                sessionStorage.setItem('welcomeMessageShown', 'true');
            }
        }

        function closeWelcomeModal() {
            const modal = document.getElementById('welcome-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        window.onload = () => {
            renderHome();
            setTimeout(showWelcomeModal, 500);
        };
    </script>
</body>
</html>
